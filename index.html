<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictGainz</title>
    <style>
        :root {
            --bg-color: #0c0c0e;
            --text-primary: #f2f2f5;
            --text-secondary: #8a8a93;
            --accent-color: #3b82f6;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border-color);
            padding: 40px 32px;
            background: rgba(24, 24, 27, 0.4);
            border-radius: 6px;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 32px;
            color: var(--text-primary);
        }

        .logo span {
            color: var(--text-secondary);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            background: transparent;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        footer {
            margin-top: 40px;
            font-size: 0.75px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">predictgainz<span>.online</span></div>
        
        <h1>Under Construction</h1>
        <p>A specialized analytics engine is currently being built here. Precision tracking and clean data systems are on the way.</p>
        
        <div class="status-badge">
            <div class="status-dot"></div>
            System initialization in progress
        </div>
    </div>

</body>
</html>
